<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Proposed workflow and review gates</title><desc id="desc">Request, planning, development, independent QA and wiki. Proposed gates require evidence; no execution is claimed.</desc>
<rect width="1200" height="380" rx="24" fill="#101b2e"/><g font-family="Arial,sans-serif">
<text x="44" y="52" fill="#f4be73" font-size="17" letter-spacing="2">PROPOSED WORKFLOW · NO EXECUTION HISTORY</text>
<text x="44" y="96" fill="#f3f7ff" font-size="32" font-weight="bold">Completion is a claim until evidence is checked.</text>
<g fill="#20334e" stroke="#587194" stroke-width="1.5"><rect x="44" y="150" width="190" height="100" rx="14"/><rect x="274" y="150" width="190" height="100" rx="14"/><rect x="504" y="150" width="190" height="100" rx="14"/><rect x="734" y="150" width="190" height="100" rx="14"/><rect x="964" y="150" width="190" height="100" rx="14"/></g>
<g fill="#f3f7ff" font-size="21" text-anchor="middle"><text x="139" y="190">00 Request</text><text x="369" y="190">01 Planning</text><text x="599" y="190">02 Development</text><text x="829" y="190">03 QA</text><text x="1059" y="190">04 Wiki</text></g>
<g fill="#b9cbe1" font-size="16" text-anchor="middle"><text x="139" y="224">Scope and exclusions</text><text x="369" y="224">Review gate</text><text x="599" y="224">Evidence + review</text><text x="829" y="224">Independent checks</text><text x="1059" y="224">Review + final gate</text></g>
<path d="M238 200h30m-7-7 7 7-7 7M468 200h30m-7-7 7 7-7 7M698 200h30m-7-7 7 7-7 7M928 200h30m-7-7 7 7-7 7" stroke="#65d6ce" stroke-width="3" fill="none"/>
<text x="44" y="310" fill="#f4be73" font-size="18">Rejection or failure should return to the relevant stage; history should remain traceable.</text>
<text x="44" y="344" fill="#9bb0ce" font-size="16">This illustration describes intended behavior, not a working automation system.</text>
</g></svg>
