<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Proposed master-led orchestration architecture</title><desc id="desc">Design only. Master coordination, control policy and workflow state are separate layers. Worker, reviewer and QA integration are not implemented.</desc>
<rect width="1200" height="620" rx="24" fill="#101b2e"/>
<g font-family="Arial,sans-serif">
<text x="44" y="49" fill="#f4be73" font-size="17" letter-spacing="2">DESIGN STUDY · NOT IMPLEMENTED</text>
<text x="44" y="96" fill="#f3f7ff" font-size="34" font-weight="bold">One coordinator. Separate decision boundaries.</text>
<g fill="#20334e" stroke="#587194" stroke-width="1.5">
<rect x="44" y="133" width="300" height="104" rx="14"/><rect x="434" y="133" width="722" height="104" rx="14"/>
<rect x="434" y="279" width="722" height="86" rx="14"/>
