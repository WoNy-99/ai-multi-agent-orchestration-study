</g>
<g fill="#f3f7ff" font-size="22" text-anchor="middle">
<text x="194" y="172">Master</text><text x="795" y="172">Harness / Control layer</text><text x="795" y="316">Workflow state and gates</text>
<text x="166" y="451">Worker</text><text x="456" y="451">Reviewer</text><text x="746" y="451">Independent QA</text><text x="1035" y="451">Wiki workflow</text>
</g>
<g fill="#b9cbe1" font-size="16" text-anchor="middle">
<text x="194" y="204">Coordinate, explain, request</text><text x="795" y="204">Permissions · Contracts · Evidence · Approval</text><text x="795" y="344">Retry · Halt · Resume design</text>
<text x="166" y="482">Scoped implementation</text><text x="456" y="482">Read-only review</text><text x="746" y="482">Separate execution</text><text x="1035" y="482">Reviewed knowledge</text>
</g>
